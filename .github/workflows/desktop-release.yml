name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, for example v0.2.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: packages/launcher
        run: |
          npm install --no-audit --no-fund
          npm --prefix ../../workspace/frontend install --no-audit --no-fund

      - name: Build unsigned Apple Silicon installer
        working-directory: packages/launcher
        run: |
          npm run build
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --arm64 --publish never \
            --config.mac.identity=null --config.mac.notarize=false

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: packages/launcher/dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Not a version tag: $TAG"
            exit 1
          fi
          shopt -s nullglob
          files=(dist/*.dmg)
          if (( ${#files[@]} == 0 )); then
            echo "No installer was built."
            exit 1
          fi
          # The macOS runner often cannot open api.github.com within the
          # release action's 10s limit. Publish from Linux, and retry.
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${files[@]}" --clobber && exit 0
            else
              gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes && exit 0
            fi
            echo "GitHub API attempt $attempt failed; retrying in 20s."
            sleep 20
          done
          exit 1
